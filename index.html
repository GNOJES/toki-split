<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b1726" />
    <meta
      name="description"
      content="손으로 그린 선으로 도형을 N등분하는 짧고 빠른 모바일 챌린지."
    />
    <title>toki-split | N등분 챌린지</title>
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body data-screen="home">
    <main class="app" id="app">
      <header class="topbar">
        <button
          id="backButton"
          class="nav-button"
          type="button"
          aria-label="뒤로"
          hidden
        >
          ‹
        </button>
        <div class="brand">
          <div class="logo" aria-hidden="true">✂</div>
          <div><strong>toki-split</strong><small>N-SPLIT CHALLENGE</small></div>
        </div>
        <button
          class="help-btn"
          id="helpButton"
          type="button"
          aria-label="게임 방법"
        >
          ?
        </button>
      </header>
      <section id="homeScreen" class="screen home-screen" aria-label="홈">
        <div class="home-copy">
          <h1>똑같이 나눌 수<br />있을까요<span>?</span></h1>
        </div>
        <div class="home-art" aria-hidden="true">
          <svg viewBox="0 0 360 330">
            <defs>
              <linearGradient id="mint-piece" x2=".9" y2="1">
                <stop stop-color="#bcffd5" />
                <stop offset="1" stop-color="#77e8b9" />
              </linearGradient>
              <linearGradient id="peach-piece" x2=".8" y2="1">
                <stop stop-color="#ffe4a5" />
                <stop offset="1" stop-color="#ffc378" />
              </linearGradient>
              <linearGradient id="pink-piece" x2=".9" y2="1">
                <stop stop-color="#f3c5e1" />
                <stop offset="1" stop-color="#baaff4" />
              </linearGradient>
            </defs>
            <g transform="rotate(-7 113 100)">
              <path
                d="M92 40Q154 24 177 36L163 155 46 126Q32 52 92 40Z"
                fill="url(#mint-piece)"
              />
              <path
                d="m79 82 8-6 8 6m25-2 8-6 8 6M94 105q13 16 27-1"
                fill="none"
                stroke="#204c45"
                stroke-width="6"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </g>
            <g transform="rotate(8 250 100)">
              <path
                d="M198 34C275 25 321 78 307 151L184 168Z"
                fill="url(#peach-piece)"
              />
              <path
                d="m221 80 9 7-9 7m43-7 9-7 9 7M235 113q14 17 27-2"
                fill="none"
                stroke="#72502d"
                stroke-width="6"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </g>
            <g transform="rotate(-3 175 238)">
              <path
                d="M49 151 172 184 299 167C311 252 245 299 165 286 88 276 36 224 49 151Z"
                fill="url(#pink-piece)"
              />
              <path
                d="m123 211 8-6 8 6m65 0 8-6 8 6M153 230q20 25 40-1"
                fill="none"
                stroke="#514268"
                stroke-width="6"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </g>
          </svg>
        </div>
        <div class="home-bottom">
          <button class="cta" id="homeStartButton" type="button">
            게임 시작
          </button>
        </div>
      </section>
      <section
        id="stageScreen"
        class="screen stage-screen"
        aria-label="스테이지 선택"
        hidden
      >
        <div class="screen-heading">
          <span class="eyebrow">CHOOSE YOUR CHALLENGE</span>
          <h1>스테이지 선택</h1>
          <p>도형을 고르면 바로 시작해요.</p>
          <span class="star-target">별 3개 · 정확도 98% 이상</span>
        </div>
        <div class="stage-rail" id="stageRail"></div>
      </section>
      <section
        id="gameScreen"
        class="screen game-screen"
        aria-label="게임"
        hidden
      >
        <section class="mission" aria-label="현재 미션">
          <span class="label" id="stageLabel">STAGE 01 / 40</span>
          <h1>
            <span id="shapeName">정사각형</span>
            <em><span id="splitCount">2</span>등분</em>
          </h1>
          <p id="subtitle" hidden></p>
        </section>
        <section class="stats" aria-label="게임 정보">
          <div class="stat">
            <div class="stat-label">남은 시간</div>
            <div class="stat-value" id="timer">2.0<small>초</small></div>
          </div>
          <div class="stat">
            <div class="stat-label">현재 조각</div>
            <div class="stat-value">
              <span id="pieceCount">1</span
              ><small> / <span id="goalCount">2</span></small>
            </div>
          </div>
          <div class="stat">
            <div class="stat-label">목표 면적</div>
            <div class="stat-value">
              <span id="targetArea">50.0</span><small>%</small>
            </div>
          </div>
        </section>
        <div class="board-area" id="boardArea">
          <section
            class="board-wrap"
            id="boardWrap"
            aria-label="도형 자르기 플레이 영역"
          >
            <div class="board" id="boardBox">
              <canvas
                id="gameCanvas"
                aria-label="드래그하여 도형을 자릅니다"
                role="img"
              ></canvas>
              <span class="canvas-hint" id="canvasHint"
                >도형을 가로질러 그어보세요</span
              >
              <span class="reveal-banner" id="revealBanner"
                >각 조각의 넓이를 확인해보세요</span
              >
              <div class="reveal-pcts" id="revealPcts" aria-live="polite"></div>
              <span
                class="floating-toast"
                id="toast"
                role="status"
                aria-live="polite"
              ></span>
            </div>
            <div class="meter" aria-hidden="true">
              <div class="meter-inner" id="timerFill"></div>
            </div>
          </section>
        </div>
        <section class="actions">
          <div id="status" class="status">
            <span id="statusText">선을 그어 조각을 나눠보세요</span>
          </div>
          <div class="action-buttons">
            <button type="button" class="mini-btn" id="undoButton" disabled>
              ↶ 되돌리기</button
            ><button type="button" class="mini-btn" id="retryButton">
              ⟳ 다시하기
            </button>
          </div>
        </section>
      </section>
    </main>
    <div
      id="modal"
      class="modal hidden"
      role="dialog"
      aria-modal="true"
      aria-label="게임 안내"
    >
      <div class="modal-card" id="modalContent"></div>
    </div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
