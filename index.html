<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b1726" />
    <meta
      name="description"
      content="손으로 그린 자유로운 절단선으로 도형을 N등분하는 타임어택 퍼즐 게임. 조각별 면적과 정확도를 측정합니다."
    />
    <title>toki-split | N등분 챌린지</title>
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <main class="app">
      <header class="topbar">
        <div class="brand">
          <div class="logo" aria-hidden="true">✂</div>
          <div><strong>toki-split</strong><small>N-SPLIT CHALLENGE</small></div>
        </div>
        <button class="help-btn" id="helpButton" type="button">
          ? 게임 방법
        </button>
      </header>
      <section aria-label="현재 미션">
        <div class="label">
          <i class="dot"></i><span id="stageLabel">STAGE 01 / 10</span>
        </div>
        <h1>
          <span id="shapeName">정사각형</span>을
          <em><span id="splitCount">2</span>등분</em>하세요!
        </h1>
        <p class="subcopy" id="subtitle">
          주어진 도형을 똑같은 넓이로 나눠보세요.
        </p>
      </section>
      <section class="stats" aria-label="게임 정보">
        <div class="stat">
          <div class="stat-label">⏱ 남은 시간</div>
          <div class="stat-value" id="timer">--<small>초</small></div>
        </div>
        <div class="stat">
          <div class="stat-label">▧ 현재 조각</div>
          <div class="stat-value">
            <span id="pieceCount">1</span
            ><small> / <span id="goalCount">2</span></small>
          </div>
        </div>
        <div class="stat">
          <div class="stat-label">◎ 목표 면적</div>
          <div class="stat-value">
            <span id="targetArea">50.0</span><small>%</small>
          </div>
        </div>
      </section>
      <section class="board-wrap" aria-label="도형 자르기 플레이 영역">
        <div class="board" id="boardBox">
          <canvas
            id="gameCanvas"
            aria-label="드래그하여 도형을 자릅니다"
            role="img"
          ></canvas>
          <span class="canvas-hint" id="canvasHint"
            >자유롭게 드래그해 손으로 잘라보세요 ✎</span
          >
          <span class="reveal-banner" id="revealBanner"
            >✦ 분할 완료! 각 조각의 넓이</span
          >
          <div class="reveal-pcts" id="revealPcts" aria-live="polite"></div>
          <span
            class="floating-toast"
            id="toast"
            role="status"
            aria-live="polite"
          ></span>
        </div>
        <div class="meter" aria-hidden="true">
          <div class="meter-inner" id="timerFill"></div>
        </div>
      </section>
      <section class="actions">
        <div id="status" class="status">
          <span class="status-dot"></span
          ><span id="statusText">게임 시작을 눌러주세요</span>
        </div>
        <div class="action-buttons">
          <button type="button" class="mini-btn" id="undoButton" disabled>
            ↶ 되돌리기</button
          ><button type="button" class="mini-btn" id="retryButton">
            ⟳ 다시하기
          </button>
        </div>
      </section>
      <section aria-label="스테이지 선택">
        <div class="rail-header">
          <strong>스테이지 선택</strong><span>클릭해 언제든 다시 도전</span>
        </div>
        <div class="stage-rail" id="stageRail"></div>
      </section>
      <footer>
        손으로 그린 절단선이 도형의 양쪽 경계를 연결하면 분리됩니다.<br />등분이
        끝나면 <strong>각 조각의 면적 비율</strong>을 보여드립니다.
      </footer>
    </main>
    <div
      id="modal"
      class="modal"
      role="dialog"
      aria-modal="true"
      aria-label="게임 안내"
    >
      <div class="modal-card" id="modalContent"></div>
    </div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
