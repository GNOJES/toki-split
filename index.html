<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b1726" />
    <meta
      name="description"
      content="손으로 그린 선으로 도형을 N등분하는 짧고 빠른 모바일 챌린지."
    />
    <title>toki-split | N등분 챌린지</title>
    <meta property="og:type" content="website" />
    <meta property="og:title" content="toki-split" />
    <meta property="og:description" content="도형을 같은 넓이로 나눠보세요." />
    <meta property="og:url" content="https://toki-split.vercel.app/" />
    <meta
      property="og:image"
      content="https://toki-split.vercel.app/assets/og-image.png"
    />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="toki-split과 두 조각으로 나눈 민트색 사각형"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="toki-split" />
    <meta
      name="twitter:image"
      content="https://toki-split.vercel.app/assets/og-image.png"
    />
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body data-screen="home">
    <main class="app" id="app">
      <header class="topbar">
        <button
          id="backButton"
          class="nav-button"
          type="button"
          aria-label="뒤로"
          hidden
        >
          ‹
        </button>
        <div class="brand">
          <div class="logo" aria-hidden="true">✂</div>
          <div><strong>toki-split</strong><small>N-SPLIT CHALLENGE</small></div>
        </div>
        <button
          class="help-btn"
          id="helpButton"
          type="button"
          aria-label="게임 방법"
        >
          ?
        </button>
      </header>
      <section id="homeScreen" class="screen home-screen" aria-label="홈">
        <div class="home-copy">
          <h1>똑같이 나눌 수<br />있을까요<span>?</span></h1>
        </div>
        <div class="home-art" aria-hidden="true">
          <svg viewBox="0 0 320 280">
            <g transform="translate(160 140) rotate(-12)">
              <path
                data-piece="left"
                d="M-101-101H91L-101 91Z"
                fill="#a4f7be"
                stroke="#d4ffe6"
                stroke-width="1"
              />
              <path
                data-piece="right"
                d="M101-91V101H-91Z"
                fill="#7bdcb4"
                stroke="#c4f8e0"
                stroke-width="1"
              />
            </g>
          </svg>
        </div>
        <div class="home-bottom">
          <button class="cta" id="homeStartButton" type="button">
            게임 시작
          </button>
        </div>
      </section>
      <section
        id="stageScreen"
        class="screen stage-screen"
        aria-label="스테이지 선택"
        hidden
      >
        <div class="screen-heading">
          <span class="eyebrow">CHOOSE YOUR CHALLENGE</span>
          <h1>스테이지 선택</h1>
          <p>도형을 고르면 바로 시작해요.</p>
          <span class="star-target">별 3개 · 정확도 98% 이상</span>
        </div>
        <div class="stage-rail" id="stageRail"></div>
      </section>
      <section
        id="gameScreen"
        class="screen game-screen"
        aria-label="게임"
        hidden
      >
        <section class="mission" aria-label="현재 미션">
          <span class="label" id="stageLabel">STAGE 01 / 40</span>
          <h1>
            <span id="shapeName">정사각형</span>
            <em><span id="splitCount">2</span>등분</em>
          </h1>
          <p id="subtitle" hidden></p>
        </section>
        <section class="stats" aria-label="게임 정보">
          <div class="stat">
            <div class="stat-label">남은 시간</div>
            <div class="stat-value" id="timer">2.0<small>초</small></div>
          </div>
          <div class="stat">
            <div class="stat-label">현재 조각</div>
            <div class="stat-value">
              <span id="pieceCount">1</span
              ><small> / <span id="goalCount">2</span></small>
            </div>
          </div>
          <div class="stat">
            <div class="stat-label">목표 면적</div>
            <div class="stat-value">
              <span id="targetArea">50.0</span><small>%</small>
            </div>
          </div>
        </section>
        <div class="board-area" id="boardArea">
          <section
            class="board-wrap"
            id="boardWrap"
            aria-label="도형 자르기 플레이 영역"
          >
            <div class="board" id="boardBox">
              <canvas
                id="gameCanvas"
                aria-label="드래그하여 도형을 자릅니다"
                role="img"
              ></canvas>
              <span class="canvas-hint" id="canvasHint"
                >도형을 가로질러 그어보세요</span
              >
              <span class="reveal-banner" id="revealBanner"
                >각 조각의 넓이를 확인해보세요</span
              >
              <div class="reveal-pcts" id="revealPcts" aria-live="polite"></div>
              <span
                class="floating-toast"
                id="toast"
                role="status"
                aria-live="polite"
              ></span>
            </div>
            <div class="meter" aria-hidden="true">
              <div class="meter-inner" id="timerFill"></div>
            </div>
          </section>
        </div>
        <section class="actions">
          <div id="status" class="status">
            <span id="statusText">선을 그어 조각을 나눠보세요</span>
          </div>
          <div class="action-buttons">
            <button type="button" class="mini-btn" id="undoButton" disabled>
              ↶ 되돌리기</button
            ><button type="button" class="mini-btn" id="retryButton">
              ⟳ 다시하기
            </button>
          </div>
        </section>
      </section>
    </main>
    <div
      id="modal"
      class="modal hidden"
      role="dialog"
      aria-modal="true"
      aria-label="게임 안내"
    >
      <div class="modal-card" id="modalContent"></div>
    </div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
